<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architecture - NIELIT-Project</title>
              <meta name="color-scheme" content="dark">
  <meta name="darkreader-lock">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono&family=Geist:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap');
    
    :root {
      color-scheme: dark;
      --bg-body: #050505;
      --bg-container: #0a0a0a;
      --node-fill: #171717;
      --node-stroke: #404040;
      --node-text: #f5f5f5;
      --node-sub: #a3a3a3;
      --edge-stroke: #525252;
      --edge-text: #a3a3a3;
      --hover-node-stroke: #a3a3a3;
      --hover-node-fill: #262626;
      --hover-edge: #d4d4d4;
    }

    body { 
      margin: 0; 
      padding: 2rem; 
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; 
      background-color: var(--bg-body); 
      color: var(--node-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .diagram-container { 
      width: 100%; 
      max-width: 1200px;
      overflow-x: auto; 
      background-color: var(--bg-container); 
      border: 1px solid #262626; 
      border-radius: 12px; 
      padding: 3rem; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    
    svg { 
      width: 100%; 
      min-width: 960px; 
      display: block; 
    }

    .node rect { 
      fill: var(--node-fill); 
      stroke: var(--node-stroke); 
      stroke-width: 1.5; 
      rx: 6; 
      transition: all 0.2s ease;
    }
    .node:hover rect {
      stroke: var(--hover-node-stroke);
      fill: var(--hover-node-fill);
    }
    
    .node text { 
      fill: var(--node-text); 
      font-size: 12px; 
      font-weight: 600; 
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
    }
    .node .sub { 
      font-family: 'Geist Mono', 'Consolas', 'Courier New', monospace; 
      font-size: 11px; 
      font-weight: normal; 
      fill: var(--node-sub); 
    }
    .node:hover text {
      fill: #ffffff;
    }
    .node:hover .sub {
      fill: #d4d4d4;
    }
    
    .edge path { 
      fill: none; 
      stroke: var(--edge-stroke); 
      stroke-width: 1.5; 
      transition: all 0.2s ease;
    }
    .edge:hover path {
      stroke: var(--hover-edge);
      stroke-width: 2;
    }
    
    .edge text { 
      font-family: 'Geist Mono', 'Consolas', 'Courier New', monospace; 
      font-size: 8px; 
      fill: var(--edge-text); 
      paint-order: stroke fill;
      stroke: var(--bg-container);
      stroke-width: 8px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    
    .title { 
      font-family: 'Instrument Serif', Georgia, serif; 
      font-size: 28px; 
      fill: var(--node-text); 
    }
    .subtitle { 
      font-family: 'Geist Mono', 'Consolas', 'Courier New', monospace; 
      font-size: 11px; 
      fill: #737373; 
    }
    
    .zone { 
      fill: rgba(255,255,255,0.02); 
      stroke: rgba(255,255,255,0.1); 
      stroke-width: 1; 
      rx: 8; 
    }
    .zone-label { 
      font-family: 'Geist Mono', 'Consolas', 'Courier New', monospace; 
      font-size: 9px; 
      fill: rgba(255,255,255,0.4); 
      letter-spacing: 0.14em; 
    }

    @keyframes flow {
      to { stroke-dashoffset: -20; }
    }
    .edge path[stroke-dasharray] {
      animation: flow 1.5s linear infinite;
      stroke: var(--node-sub);
    }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg viewBox="0 0 1190 600" role="img" aria-labelledby="title desc">
      <title id="title">NIELIT-Project Architecture</title>
      <desc id="desc">House Price Predictor Machine Learning Pipeline</desc>
      
                                    <defs>
        <marker id="arrow" viewBox="0 0 190 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0.0 0.0 L 10.5 5.0 L 0.0 10.0 z" fill="#525252" style="fill: context-stroke;" />
        </marker>
      </defs>

      <text x="42.1" y="60" class="title">House Price Predictor</text>
      <text x="42.1" y="80" class="subtitle">Random Forest ML Pipeline</text>

      <!-- Zones -->
      <rect x="42.1" y="120" width="210.6" height="400" class="zone" />
      <text x="52.6" y="135" class="zone-label">FRONTEND UI</text>

      <rect x="294.8" y="120" width="252.7" height="400" class="zone" />
      <text x="305.4" y="135" class="zone-label">DATA PIPELINE</text>

      <rect x="589.7" y="120" width="517.0" height="400" class="zone" />
      <text x="600.2" y="135" class="zone-label">MACHINE LEARNING & ANALYTICS</text>

      <!-- Nodes -->
      <g class="node" transform="translate(84.2, 200)">
        <rect x="0.0" y="0" width="126.4" height="60" />
        <text x="63.2" y="25" text-anchor="middle" >Prediction Tab</text>
        <text x="63.2" y="40" class="sub" text-anchor="middle" >User Input</text>
      </g>
      <g class="node" transform="translate(84.2, 340)">
        <rect x="0.0" y="0" width="126.4" height="60" />
        <text x="63.2" y="25" text-anchor="middle" >Analytics Tab</text>
        <text x="63.2" y="40" class="sub" text-anchor="middle" >Data Visualization</text>
      </g>

      <g class="node" transform="translate(337.0, 200)">
        <rect x="0.0" y="0" width="168.5" height="60" />
        <text x="84.2" y="25" text-anchor="middle" >Mumbai Property Data</text>
        <text x="84.2" y="40" class="sub" text-anchor="middle" >76k+ rows</text>
      </g>
      <g class="node" transform="translate(337.0, 340)">
        <rect x="0.0" y="0" width="168.5" height="60" />
        <text x="84.2" y="25" text-anchor="middle" >ColumnTransformer</text>
        <text x="84.2" y="40" class="sub" text-anchor="middle" >Scaler & Encoder</text>
      </g>

      <g class="node" transform="translate(631.8, 200)">
        <rect x="0.0" y="0" width="168.5" height="60" />
        <text x="84.2" y="25" text-anchor="middle" >Random Forest Regressor</text>
        <text x="84.2" y="40" class="sub" text-anchor="middle" >scikit-learn</text>
      </g>
      <g class="node" transform="translate(631.8, 340)">
        <rect x="0.0" y="0" width="168.5" height="60" />
        <text x="84.2" y="25" text-anchor="middle" >Data Analytics</text>
        <text x="84.2" y="40" class="sub" text-anchor="middle" >Matplotlib Charts</text>
      </g>

      <!-- Edges -->
      <g class="edge">
        <!-- UI to Pipeline -->
        <path d="M 147.4 260.0 L 147.4 280.0 L 305.4 280.0 L 305.4 370.0 L 337.0 370.0" marker-end="url(#arrow)" />
        <path d="M 210.6 370.0 L 337.0 370.0" marker-end="url(#arrow)" />
        
        <!-- Data to Pipeline -->
        <path d="M 421.2 260.0 L 421.2 340.0" marker-end="url(#arrow)" />

        <!-- Pipeline to ML -->
        <path d="M 505.4 370.0 L 568.6 370.0 L 568.6 230.0 L 631.8 230.0" marker-end="url(#arrow)" />

        <!-- ML back to UI -->
        <path d="M 716.0 200.0 L 716.0 160.0 L 147.4 160.0 L 147.4 200.0" marker-end="url(#arrow)" />
        <text x="431.7" y="163" text-anchor="middle" >Price Estimate</text>

        <!-- UI Analytics to Analytics Engine -->
        <path d="M 210.6 370.0 L 250.0 370.0 L 250.0 440.0 L 590.0 440.0 L 590.0 370.0 L 631.8 370.0" marker-end="url(#arrow)" />
      </g>
    </svg>
  </div>
</body>
</html>
